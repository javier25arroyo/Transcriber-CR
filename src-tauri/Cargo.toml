[package]
name = "voice-type"
description = "Voice Type — dictado por voz local para Windows 11"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# El crate tiene dos binarios (ver [[bin]] más abajo): `echo-sidecar` es un
# sidecar de mentira sólo para tests de integración. `cargo run` (que
# `tauri dev` invoca sin `--bin`) no puede elegir entre los dos sin esto.
default-run = "voice-type"

[lib]
name = "voice_type"
path = "src/lib.rs"

[[bin]]
name = "voice-type"
path = "src/main.rs"
# La app sólo se construye con la feature `app`; ver la nota de [features].
required-features = ["app"]

# Sidecar de mentira para los tests de integración del supervisor: habla el
# mismo protocolo sin modelo ni GPU. Es un target de test, no parte del
# producto; Tauri empaqueta sólo el binario `voice-type`.
[[bin]]
name = "echo-sidecar"
path = "tests/bin/echo_sidecar.rs"

# Verificación manual de la captura de micrófono (Task 7, Step 5 del plan).
# `required-features` hace que `cargo` lo salte solo, sin error, cuando la
# feature `capture` está apagada — así el job de Linux del CI (que corre
# `--all-targets` con `--no-default-features` y con `--features injector`,
# ninguna de las dos con `capture`) no intenta compilarlo.
[[example]]
name = "mic_probe"
path = "examples/mic_probe.rs"
required-features = ["capture"]

[features]
default = ["app"]
# `app` agrega todo lo que necesita la aplicación Tauri real (WebView2 en
# Windows, WebKitGTK en Linux) más el `tauri-build` que genera el contexto a
# partir de `tauri.conf.json`.
#
# Sin esta feature el crate compila solamente la librería `voice_type`: módulos
# puros y deterministas (config, vocab_store, post_processor, ipc, vad,
# text_injector, supervisor) que no dependen de ningún toolkit gráfico. Eso
# permite `cargo test -p voice-type --no-default-features` en cualquier máquina
# sin instalar las dependencias de sistema de Tauri — ver CONTRIBUTING.md
# ("Running tests"). El build completo de la app sigue siendo Windows 11.
app = ["dep:tauri", "dep:tauri-build", "injector", "capture"]
# El portapapeles y el teclado sintético son parte de la app, pero no dependen
# de Tauri: en su propia feature se pueden compilar (y así, revisar) sin
# WebView2 ni WebKitGTK.
injector = ["dep:arboard", "dep:enigo"]
# La captura de micrófono tampoco depende de Tauri. A diferencia de `injector`,
# no se prueba en el job de Linux del CI: el backend de `cpal` ahí necesita los
# headers de ALSA (`libasound2-dev`), que no están garantizados en el runner.
# Se compila y prueba de verdad sólo en el job de Windows (dentro de `app`) y
# se verifica a mano con el ejemplo `mic_probe`.
capture = ["dep:cpal"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# Resample a 16 kHz. Fijado en la 0.16 a propósito: de la 1.0 en adelante la API
# pasa a buffers de `audioadapter`, que para un downmix mono a tasa fija sólo
# agrega dependencias y ceremonia. Es Rust puro, así que compila y se testea en
# cualquier plataforma.
rubato = "0.16"
serde_json = "1"
tauri = { version = "2", optional = true , features = [] }
# Portapapeles y teclado sintético: sólo los usa la app real (ver text_injector).
arboard = { version = "3", optional = true }
enigo = { version = "0.6", optional = true }
cpal = { version = "0.17", optional = true, default-features = false }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dev-dependencies]
tempfile = "3"
