name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      # These steps need a workspace Cargo.toml, which doesn't exist until
      # Task 1 of the implementation plan (scaffold) lands. Skipping instead
      # of failing keeps main's required checks meaningful once code exists,
      # without a permanent red X on an empty repo. Remove this guard once
      # Cargo.toml is committed — a real absence of it at that point should
      # fail loudly.
      - name: Check formatting
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all -- --check

      # Only the voice-type package: stt-sidecar depends on whisper-rs with
      # the `cuda` feature, which needs the CUDA Toolkit — not available on
      # GitHub-hosted runners. See docs/adr/0001-isolated-stt-sidecar.md.
      - name: Clippy (voice-type only, no GPU crate)
        if: hashFiles('Cargo.toml') != ''
        run: cargo clippy -p voice-type --all-targets -- -D warnings

      - name: Test (voice-type only, no GPU crate)
        if: hashFiles('Cargo.toml') != ''
        run: cargo test -p voice-type

  frontend:
    name: Frontend (vitest, svelte-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-node's own npm cache needs a lock file to key off; without one
      # it errors before any of our hashFiles guards below even run. Disable
      # caching when there's nothing to cache yet — restore `cache: npm`
      # unconditionally in the same Task 1 step that removes the other guards.
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      # Same reasoning as the Rust job's guards above: no package.json until
      # Task 1's scaffold lands. Remove this guard once it's committed.
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Unit tests
        if: hashFiles('package.json') != ''
        run: npx vitest run

      - name: Svelte type check
        if: hashFiles('package.json') != ''
        run: npx svelte-check
